spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gk_iam;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: 
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql
      data-locations: classpath:h2-data.sql

  h2:
    console:
      enabled: true
      path: /h2-console
